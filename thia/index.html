<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Sempro, Thia! 🎓</title>
    <link rel="icon" type="image/jpeg" href="../images/favicon.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        /* Torn Paper Effect */
        .torn-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05) 0%, transparent 50%),
                linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            z-index: 1;
        }

        .torn-bg::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 60%;
            background: 
                radial-gradient(ellipse at top right, rgba(255,255,255,0.15) 0%, transparent 70%);
            clip-path: polygon(60% 0%, 100% 0%, 100% 45%, 85% 52%, 100% 60%, 100% 100%, 70% 85%, 45% 100%, 20% 90%, 0% 80%, 15% 65%, 0% 50%, 10% 35%, 0% 20%, 25% 15%);
        }

        .torn-bg::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 35%;
            height: 40%;
            background: 
                radial-gradient(ellipse at bottom left, rgba(255,255,255,0.1) 0%, transparent 70%);
            clip-path: polygon(0% 60%, 15% 50%, 0% 40%, 10% 25%, 25% 35%, 40% 20%, 55% 35%, 70% 25%, 85% 40%, 100% 30%, 90% 50%, 100% 70%, 85% 85%, 70% 100%, 40% 90%, 20% 100%, 0% 85%);
        }

        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 3rem 2.5rem;
        }

        /* Header Text */
        .header-text {
            margin-bottom: 2rem;
        }

        .selamat {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: #ffffff;
            font-style: italic;
            margin-bottom: 5px;
            letter-spacing: 0.05em;
            display: block;
        }

        .sempro {
            font-family: 'Poppins', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 25%, #ff6b35 50%, #e74c3c 75%, #ff6b35 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
            display: block;
        }

        .sempro-shadow {
            font-family: 'Poppins', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.1);
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-top: -5rem;
            margin-left: 0.1rem;
            z-index: -1;
            position: relative;
            display: block;
        }

        /* Photo Container */
        .photo-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2rem 0;
            position: relative;
        }

        .photo-frame {
            width: 280px;
            height: 320px;
            background: #ffffff;
            border-radius: 15px;
            padding: 15px;
            transform: rotate(-2deg);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255,255,255,0.1);
            position: relative;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        /* Decorative Elements */
        .decorative-text {
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3em;
            font-weight: 500;
        }

        .decorative-crosses {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
        }

        .cross-1 { top: 25%; left: 8%; }
        .cross-2 { top: 45%; left: 5%; }
        .cross-3 { bottom: 35%; right: 8%; }
        .cross-4 { bottom: 15%; right: 12%; }

        /* Name Section */
        .name-section {
            margin-top: auto;
        }

        .name {
            font-family: 'Poppins', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: #ff6b35;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            line-height: 1.1;
        }

        .description {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            max-width: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card-container {
                max-width: 90vw;
                aspect-ratio: 2/3;
            }
            
            .content {
                padding: 2rem 1.5rem;
            }
            
            .header-text {
                margin-bottom: 1.5rem;
            }
            
            .selamat {
                font-size: 1.8rem;
                margin-bottom: 2px;
            }
            
            .sempro,
            .sempro-shadow {
                font-size: 3rem;
            }
            
            .sempro {
                margin-bottom: 0.3rem;
            }
            
            .sempro-shadow {
                margin-top: -3.3rem;
            }
            
            .photo-frame {
                width: 200px;
                height: 240px;
            }
            
            .name {
                font-size: 1.6rem;
                letter-spacing: 0.01em;
            }
            
            .description {
                font-size: 0.85rem;
                line-height: 1.5;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 1.5rem 1rem;
            }
            
            .header-text {
                margin-bottom: 0.8rem;
            }
            
            .selamat {
                margin-bottom: 2px;
                font-size: 1.6rem;
            }
            
            .sempro,
            .sempro-shadow {
                font-size: 2.5rem;
            }
            
            .sempro {
                margin-bottom: 0.2rem;
            }
            
            .sempro-shadow {
                margin-top: -2.7rem;
            }
            
            .photo-container {
                margin: 1rem 0;
            }
            
            .photo-frame {
                width: 160px;
                height: 200px;
            }
            
            .name {
                font-size: 1.3rem;
                letter-spacing: 0em;
                margin-bottom: 0.8rem;
            }
            
            .description {
                font-size: 0.8rem;
                line-height: 1.4;
            }
        }

        /* Hover Effects */
        .card-container:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
        }

        .photo-frame:hover {
            transform: rotate(0deg);
            transition: transform 0.3s ease;
        }

        /* Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content > * {
            animation: fadeInUp 0.8s ease forwards;
        }

        .header-text { animation-delay: 0.1s; }
        .photo-container { animation-delay: 0.3s; }
        .name-section { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="torn-bg"></div>
        
        <div class="content">
            <div class="header-text">
                <div class="selamat">Selamat</div>
                <div class="sempro">SEMPRO</div>
                <div class="sempro-shadow">SEMPRO</div>
            </div>
            
            <div class="photo-container">
                <div class="photo-frame">
                    <div class="photo-placeholder">
                        <img src="semprothia.jpeg" alt="Foto Thia">
                    </div>
                </div>
                
                <div class="decorative-text">SEMPROTULATIONS</div>
                
                <div class="decorative-crosses cross-1">✕</div>
                <div class="decorative-crosses cross-2">✕</div>
                <div class="decorative-crosses cross-3">✕</div>
                <div class="decorative-crosses cross-4">✕</div>
            </div>
            
            <div class="name-section">
                <div class="name">BAKTHI NUSWANTARI ACHMAD</div>
                <div class="description">
                    Selamat atas seminar proposal kamu thiaa! Semua kerja keras dan begadang kemarin telah membuahkan hasil wkwkwk. Semoga sukses dan lancar juga buat Seminar Hasilnyaa!!!.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add some interactive effects
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.card-container');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
        });
        
        document.addEventListener('mouseleave', () => {
            const card = document.querySelector('.card-container');
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
        });
    </script>
</body>
</html>
