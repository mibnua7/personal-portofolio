<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate</title>
    <link rel="icon" type="image/jpeg" href="../images/favicon.jpeg">
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #667eea !important;
        }

        body {
            background-image: none !important;
            background-attachment: unset !important;
        }

        .donate-container {
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #667eea !important;
            z-index: 999;
        }

        .donate-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .donate-icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
        }

        .donate-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 1rem;
            font-family: 'Poppins', sans-serif;
        }

        .donate-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .donate-message {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .kitabisa-link {
            display: inline-block;
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .kitabisa-link:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .kitabisa-link:hover:before {
            left: 100%;
        }

        .kitabisa-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            color: white;
        }

        .donate-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .feature-item {
            background: rgba(102, 126, 234, 0.1);
            padding: 1rem;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-3px);
        }

        .feature-icon {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .feature-text {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }

        /* Dark mode support */
        body.light-mode .donate-card {
            background: rgba(0, 0, 0, 0.85);
            color: white;
        }

        body.light-mode .donate-title {
            color: white;
        }

        body.light-mode .donate-subtitle,
        body.light-mode .donate-message {
            color: #ccc;
        }

        body.light-mode .feature-text {
            color: #aaa;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .donate-card {
                padding: 2rem;
                margin: 1rem;
            }

            .donate-title {
                font-size: 2rem;
            }

            .back-button {
                top: 1rem;
                left: 1rem;
                padding: 0.6rem 1.2rem;
            }

            .donate-features {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="donate-container">
        <div class="donate-card">
            <div class="donate-icon">
                <i class="fas fa-heart"></i>
            </div>
            
            <h1 class="donate-title">Ingin Berdonasi?</h1>
            
            <p class="donate-subtitle">
                Terima kasih atas niat baik Kamu untuk berdonasi! Cukup follow, like, comment dan share aja yaa! :D
            </p>
            
            <p class="donate-message">
                Jika Kamu ingin berdonasi, bisa di kitabisa.com yaa!! :D
            </p>
            
            <a href="https://kitabisa.com" target="_blank" class="kitabisa-link">
                <i class="fas fa-external-link-alt"></i>
                Kunjungi Kitabisa.com
            </a>
            
    
            </div>
        </div>
    </div>

    <script>
        // Apply theme from localStorage if available
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
        }
    </script>
</body>
</html>
